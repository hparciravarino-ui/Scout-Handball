<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E2A"/>
      <stop offset="50%" stop-color="#00008B"/>
      <stop offset="100%" stop-color="#000055"/>
    </linearGradient>

    <!-- Ball Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Tactical Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Tactical Net Grid Pattern (Subtle) -->
  <path d="M 96,160 L 416,160 M 96,224 L 416,224 M 96,288 L 416,288 M 96,352 L 416,352
           M 160,96 L 160,416 M 224,96 L 224,416 M 288,96 L 288,416 M 352,96 L 352,416"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Outer Strategic Handball Goal Arc (9m Line) -->
  <path d="M 120,400 A 180,180 0 0,1 392,400" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 8" opacity="0.8"/>
  <path d="M 150,380 A 140,140 0 0,1 362,380" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Tricolore Italian Flag Banner at Top -->
  <g opacity="0.95" filter="url(#dropShadow)">
    <rect x="176" y="44" width="53" height="10" rx="3" fill="#008C45"/>
    <rect x="229" y="44" width="54" height="10" rx="0" fill="#F4F5F0"/>
    <rect x="283" y="44" width="53" height="10" rx="3" fill="#CD212A"/>
  </g>

  <!-- Stylized Handball Ball -->
  <g filter="url(#dropShadow)" transform="translate(256, 240)">
    <!-- Base Ball Sphere -->
    <circle cx="0" cy="0" r="110" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="6"/>

    <!-- Handball Panel Seams (IHF Panel Pattern) -->
    <path d="M -90,-20 C -40,-80 40,-80 90,-20 C 50,40 -50,40 -90,-20 Z" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
    <path d="M -80,40 C -30,100 30,100 80,40 C 40,-20 -40,-20 -80,40 Z" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
    <path d="M -30,-100 C 20,-50 20,50 -30,100 C -80,50 -80,-50 -30,-100 Z" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
    <path d="M 30,-100 C 80,-50 80,50 30,100 C -20,50 -20,-50 30,-100 Z" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

    <!-- Dynamic Motion / Grip Accents -->
    <circle cx="-35" cy="-35" r="8" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="-15" cy="-55" r="5" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- Scout Tactical Clipboard / Stopwatch Silhouette Overlay -->
  <g filter="url(#dropShadow)">
    <path d="M 140,380 Q 256,430 372,380" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
    <!-- Scout Star / Lightning Icon -->
    <path d="M 256,380 L 263,398 L 282,398 L 267,409 L 273,427 L 256,416 L 239,427 L 245,409 L 230,398 L 249,398 Z" fill="#FDE047"/>
  </g>

  <!-- App Title Typography Badge -->
  <text x="256" y="470" font-family="'Inter', 'Helvetica', 'Arial', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="4" text-anchor="middle" opacity="0.95">
    SCOUT
  </text>
</svg>
